# =============================================================================
#  BOUTONS
# =============================================================================
button:
  - platform: template
    name: "Exit Fault State"
    icon: "mdi:restore"
    entity_category: config
    on_press:
      then:
        - lambda: |-
            auto cmd = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(id(anenji), 426, 1, {1});
            id(anenji)->queue_command(cmd);

# =============================================================================
#  ÉTAT APPAREIL + LED
# =============================================================================
binary_sensor:
  - platform: status
    name: "Device Online"

  # Contrôle de coherence inter-parametres. Les bornes individuelles ne
  # suffisent pas : OVP 28,0 V avec une charge a 30,0 V reste dans les
  # bornes mais est physiquement incoherent. Ce capteur passe en probleme
  # des que l'ordre OVP > bulk > float > recovery > cutoff, l'ordre des
  # seuils SOC ou les maxima du modele ne sont plus respectes.
  - platform: template
    name: "Configuration Incoherent"
    id: config_incoherent
    entity_category: diagnostic
    device_class: problem
    lambda: |-
      float ovp = id(cfg_battery_ovp).state;
      float bulk = id(cfg_battery_bulk).state;
      float flt = id(cfg_battery_float).state;
      float rec = id(cfg_battery_recovery).state;
      float cut = id(cfg_battery_cutoff).state;
      float soc_util = id(cfg_soc_back_utility).state;
      float soc_batt = id(cfg_soc_back_battery).state;
      float soc_cut = id(cfg_soc_cutoff).state;
      // Avant le premier poll, les etats valent 0 : ne rien publier.
      if (ovp <= 0.0f || bulk <= 0.0f || flt <= 0.0f || rec <= 0.0f || cut <= 0.0f ||
          soc_batt <= 0.0f)
        return {};
      bool coherent = ovp > bulk && bulk > flt && flt > rec && rec > cut &&
                      id(cfg_max_charge_current).state <= ${max_charge_current_a} &&
                      id(cfg_max_mains_charge_current).state <= ${max_mains_charge_current_a} &&
                      soc_cut < soc_util && soc_util < soc_batt && soc_batt >= 60.0f;
      return !coherent;

output:
  - platform: ledc
    pin: GPIO2
    id: led_output
    frequency: 1Hz

light:
  - platform: monochromatic
    output: led_output
    name: "Status LED"
    id: status_led
    icon: "mdi:led-on"
    restore_mode: ALWAYS_OFF
    entity_category: config
